[package]
name = "broadcast-ecosystem-core"
version = "0.1.0"
description = "Broadcast Ecosystem Desktop Rust Core"
edition = "2021"

[lib]
name = "broadcast_ecosystem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
hound = "3.5"
parking_lot = "0.12"
crossbeam-channel = "0.5"
byteorder = "1.5"
rtrb = "0.4"
rusty_mp3 = "1.0"
symphonia = { version = "0.5.4", features = ["mp3", "wav", "flac", "ogg", "vorbis"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
